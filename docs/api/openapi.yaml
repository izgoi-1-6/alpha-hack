openapi: "3.1.0"
info:
  title: "Кредитный маршрут — API"
  version: "1.0.0"
  description: |-
    API «Кредитного маршрута»: путь клиента малого бизнеса от добавления компании до окончательного решения и работа кредитного специалиста. Все пути начинаются с `/api/v1`. Документ сгенерирован из кода (`scripts/export-api-docs.py`); интерактивная версия — http://127.0.0.1:8000/docs.

    **Сессия.** `POST /auth/register` или `POST /auth/login` ставят cookie `credit_route_session` (HttpOnly, SameSite=Lax, срок 12 часов, `Secure` при `COOKIE_SECURE=true`). Без действующей сессии — 401 `AUTH_REQUIRED`. Роли: клиент (`CLIENT`) и кредитный специалист (`CREDIT_OFFICER`); чужая роль — 403 `CLIENT_REQUIRED` или `OFFICER_REQUIRED`, чужой или несуществующий ресурс — 404.

    **Origin.** Каждый запрос POST, PATCH и DELETE должен нести заголовок `Origin`, точно равный адресу интерфейса (`UI_ORIGIN`, по умолчанию `http://localhost:5173`), иначе 403 `ORIGIN_FORBIDDEN`.

    **Idempotency-Key.** Команды, меняющие состояние, требуют заголовок `Idempotency-Key` (1–128 символов). Повтор с тем же ключом и телом возвращает сохранённый ответ и ничего не выполняет снова; тот же ключ с другим телом — 409 `IDEMPOTENCY_CONFLICT`. Ключ не нужен для регистрации, входа и выхода, `POST /companies`, подбора (`POST /companies/{company_id}/recommendations`) и `PATCH /applications/{application_id}/answers`.

    **version.** Команды над заявкой передают в теле `version` — текущую целую ревизию заявки (для `POST /companies/{company_id}/precheck/retry` — ревизию компании). Несовпадение — 409 `VERSION_CONFLICT`; успешная команда увеличивает ревизию на 1.

    **Ошибки.** Тело ошибки — `{"error": {"code": "…", "message": "…", "fields": {…}, "details": {…}}}`: `code` — английский код, `message` — текст на русском, `fields` — сообщения по полям, `details` — данные для интерфейса. Неизвестные ключи в теле запроса — 422 `VALIDATION_ERROR`.

    **Скоринг.** Маршруты клиента не возвращают балл, категорию риска, факторы, флаги проверки и рассчитанный лимит. Маршруты `/officer/*` возвращают их полностью.

    Суммы — целые рубли, время — UTC в ISO 8601 с `Z`. Все данные синтетические; внешние сервисы (реестр, обороты, БКИ, Госуслуги, уведомления, Альфа-Бизнес) — локальные заглушки.
paths:
  /api/v1/auth/register:
    post:
      tags:
        - "Аутентификация"
      summary: "Регистрация клиента"
      operationId: "register_api_v1_auth_register_post"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
        required: true
      responses:
        "201":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        "422":
          description: "Ошибка проверки данных"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "Создаёт пользователя с ролью CLIENT и сразу открывает сессию (cookie `credit_route_session`). Почта приводится к нижнему регистру, пароль — 10–128 символов, имя — 1–100. 201 `{user}`; 409 `EMAIL_EXISTS`."
      security: []
      parameters:
        -
          $ref: "#/components/parameters/Origin"
  /api/v1/auth/login:
    post:
      tags:
        - "Аутентификация"
      summary: "Вход"
      operationId: "login_api_v1_auth_login_post"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
        required: true
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        "422":
          description: "Ошибка проверки данных"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "Открывает новую сессию на 12 часов. 200 `{user}`; 401 `INVALID_CREDENTIALS`; 429 `LOGIN_RATE_LIMIT` после 10 неудачных попыток за 15 минут для пары «почта + адрес клиента»."
      security: []
      parameters:
        -
          $ref: "#/components/parameters/Origin"
  /api/v1/auth/logout:
    post:
      tags:
        - "Аутентификация"
      summary: "Выход"
      operationId: "logout_api_v1_auth_logout_post"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrictModel"
        required: true
      responses:
        "204":
          description: "Успешный ответ"
        "422":
          description: "Ошибка проверки данных"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "Тело — пустой объект `{}`. Отзывает текущую сессию и удаляет cookie; повтор безопасен. 204."
      security: []
      parameters:
        -
          $ref: "#/components/parameters/Origin"
  /api/v1/auth/me:
    get:
      tags:
        - "Аутентификация"
      summary: "Текущий пользователь"
      operationId: "me_api_v1_auth_me_get"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "`{user: {id, email, display_name, role}}`; 401 `AUTH_REQUIRED` без действующей сессии."
  /api/v1/identity/gosuslugi/verify:
    post:
      tags:
        - "Госуслуги"
      summary: "Подтверждение полномочий через Госуслуги (заглушка)"
      operationId: "verify_api_v1_identity_gosuslugi_verify_post"
      parameters:
        -
          $ref: "#/components/parameters/Origin"
        -
          name: "Idempotency-Key"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
            title: "Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorityCheckInput"
      responses:
        "201":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        "422":
          description: "Ошибка проверки данных"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "Только CLIENT. Для ИНН из синтетического справочника всегда подтверждает представителя: ФИО директора из фикстуры, роль «Генеральный директор» (ООО) или «Индивидуальный предприниматель» (ИП). 201 `{verification_id, inn, person_name, role, verified_at, expires_at}`; подтверждение действует 30 минут и добавляет одну компанию. ИНН вне справочника — 422 `REGISTRY_NOT_FOUND`. Реальные ЕСИА/Госуслуги не вызываются."
  /api/v1/consents/documents:
    get:
      tags:
        - "Компании"
      summary: "Тексты согласий"
      operationId: "consent_documents_api_v1_consents_documents_get"
      parameters:
        -
          name: "stage"
          in: "query"
          required: true
          schema:
            enum:
              - "onboarding"
              - "application"
            type: "string"
            title: "Stage"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        "422":
          description: "Ошибка проверки данных"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "`stage=onboarding` — ONBOARDING_PROCESSING и REGISTRY_LOOKUP, `stage=application` — APPLICATION_PROCESSING и BKI. Версия текстов `consent-v2`. Доступно без входа."
      security: []
  /api/v1/demo/fixtures:
    get:
      tags:
        - "Компании"
      summary: "Синтетические компании для выбора"
      operationId: "demo_fixtures_api_v1_demo_fixtures_get"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "Только CLIENT. ИНН, название, тип и состояние источников каждой синтетической компании; при `DEMO_MODE=false` — 404."
  /api/v1/companies:
    get:
      tags:
        - "Компании"
      summary: "Компании клиента"
      operationId: "list_companies_api_v1_companies_get"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "`{items, total}` в порядке добавления."
    post:
      tags:
        - "Компании"
      summary: "Добавление компании"
      description: "Тело: `inn`, оба согласия этапа onboarding версии `consent-v2` с `accepted: true` и `authority_verification_id`. Порядок отказов: 422 `REGISTRY_NOT_FOUND` → 403 `AUTHORITY_NOT_VERIFIED` (нет, чужое, другого ИНН, использованное или просроченное подтверждение) → 409 `COMPANY_EXISTS`. 201 `{company, precheck}`: данные реестра и оборотов из синтетических источников."
      operationId: "onboard_api_v1_companies_post"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
        required: true
      responses:
        "201":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        "422":
          description: "Ошибка проверки данных"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        -
          $ref: "#/components/parameters/Origin"
  /api/v1/companies/{company_id}/precheck:
    get:
      tags:
        - "Компании"
      summary: "Последняя проверка источников"
      operationId: "read_company_api_v1_companies__company_id__precheck_get"
      parameters:
        -
          name: "company_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Company Id"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        "422":
          description: "Ошибка проверки данных"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "То же, что `GET /companies/{company_id}`."
  /api/v1/companies/{company_id}:
    get:
      tags:
        - "Компании"
      summary: "Компания и последняя проверка источников"
      operationId: "read_company_api_v1_companies__company_id__get"
      parameters:
        -
          name: "company_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Company Id"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        "422":
          description: "Ошибка проверки данных"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "`{company, precheck}`. Чужая или несуществующая компания — 404 `COMPANY_NOT_FOUND`."
  /api/v1/companies/{company_id}/precheck/retry:
    post:
      tags:
        - "Компании"
      summary: "Повторная проверка источников"
      operationId: "retry_precheck_api_v1_companies__company_id__precheck_retry_post"
      parameters:
        -
          $ref: "#/components/parameters/Origin"
        -
          name: "company_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Company Id"
        -
          name: "Idempotency-Key"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
            title: "Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionInput"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        "422":
          description: "Ошибка проверки данных"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "Тело `{version}` — текущая версия компании. Добавляет новую проверку по сценарию восстановления фикстуры (реестр или обороты), версия компании +1. БКИ не запрашивается. 409 `VERSION_CONFLICT`."
  /api/v1/catalog:
    get:
      tags:
        - "Каталог и подбор"
      summary: "Каталог продуктов"
      operationId: "read_catalog_api_v1_catalog_get"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "Версии каталога и правил, ключевая ставка, шкала суммы, 11 продуктов-карточек с действующими условиями и надстройка-бейдж. Доступно без входа."
      security: []
  /api/v1/companies/{company_id}/recommendations:
    post:
      tags:
        - "Каталог и подбор"
      summary: "Подбор продуктов на сумму"
      operationId: "create_recommendation_api_v1_companies__company_id__recommendations_post"
      parameters:
        -
          $ref: "#/components/parameters/Origin"
        -
          name: "company_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Company Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NeedInput"
      responses:
        "201":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        "422":
          description: "Ошибка проверки данных"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "Тело `{requested_amount_rub}` — целое число от 1 до 2 000 000 000. 201 — неизменяемый снимок `{snapshot_id, catalog_version, rules_version, items, created_at}`: все продукты по рангу со статусом `fits`, `needs_info` или `does_not_fit`, проверками, личной предварительной оценкой и платежом. БКИ не запрашивается, скоринг не считается. Без `Idempotency-Key`: каждый вызов — новый снимок."
  /api/v1/companies/{company_id}/recommendations/{snapshot_id}:
    get:
      tags:
        - "Каталог и подбор"
      summary: "Сохранённый снимок подбора"
      operationId: "read_recommendation_api_v1_companies__company_id__recommendations__snapshot_id__get"
      parameters:
        -
          name: "company_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Company Id"
        -
          name: "snapshot_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Snapshot Id"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        "422":
          description: "Ошибка проверки данных"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "Тот же снимок без пересчёта. 404 `RECOMMENDATION_NOT_FOUND`."
  /api/v1/applications:
    post:
      tags:
        - "Заявки клиента"
      summary: "Создание черновика заявки"
      operationId: "create_application_api_v1_applications_post"
      parameters:
        -
          $ref: "#/components/parameters/Origin"
        -
          name: "Idempotency-Key"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
            title: "Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInput"
      responses:
        "201":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        "422":
          description: "Ошибка проверки данных"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "Тело `{company_id, product_id, recommendation_snapshot_id}`; продукт должен входить в снимок этой компании. 201 — заявка в статусе DRAFT, версия 1. 422 `PRODUCT_NOT_SUPPORTED`, 409 `RECOMMENDATION_STALE` (каталог или правила изменились после подбора)."
    get:
      tags:
        - "Заявки клиента"
      summary: "Заявки клиента"
      operationId: "list_applications_api_v1_applications_get"
      parameters:
        -
          name: "status"
          in: "query"
          required: false
          schema:
            anyOf:
              -
                enum:
                  - "DRAFT"
                  - "CHECKING"
                  - "WAIT_EXTERNAL"
                  - "MANUAL_REVIEW"
                  - "NEED_INFO"
                  - "PREAPPROVED"
                  - "DOCS_UPLOADED"
                  - "DOCS_REWORK"
                  - "APPROVED"
                  - "REJECTED"
                  - "CANCELLED"
                  - "EXPIRED"
                type: "string"
              -
                type: "null"
            title: "Status"
        -
          name: "company_id"
          in: "query"
          required: false
          schema:
            anyOf:
              -
                type: "string"
              -
                type: "null"
            title: "Company Id"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        "422":
          description: "Ошибка проверки данных"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "Фильтры `status` и `company_id`; новые первыми. Перед фильтром применяется ленивое истечение срока."
  /api/v1/applications/{application_id}:
    get:
      tags:
        - "Заявки клиента"
      summary: "Заявка"
      operationId: "read_application_api_v1_applications__application_id__get"
      parameters:
        -
          name: "application_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Application Id"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        "422":
          description: "Ошибка проверки данных"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "`{application}`: ответы, суммы, `allowed_actions`, `missing_fields`, открытый запрос сведений, сводка документов. Скоринга нет: ни балла, ни риска, ни факторов, ни рассчитанного лимита."
  /api/v1/applications/{application_id}/dialog:
    get:
      tags:
        - "Заявки клиента"
      summary: "Анкета из шести этапов"
      operationId: "read_dialog_api_v1_applications__application_id__dialog_get"
      parameters:
        -
          name: "application_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Application Id"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        "422":
          description: "Ошибка проверки данных"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Ошибка"
          content:
            application/json:
