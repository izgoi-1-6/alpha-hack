      description: "multipart/form-data: `file`, `document_type`, `version`. PDF, JPEG или PNG до 20 МиБ: расширение, MIME-тип, сигнатура и структура файла должны совпадать. Только в PREAPPROVED и DOCS_REWORK. 201 `{document, application}`; 413 `FILE_TOO_LARGE`, 415 `MEDIA_NOT_ALLOWED`, 422 `FILE_INVALID`, 422 `DOCUMENT_TYPE_NOT_ALLOWED`, 409 `DOCUMENT_ACCEPTED`."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: "object"
              required:
                - "file"
                - "document_type"
                - "version"
              properties:
                file:
                  type: "string"
                  format: "binary"
                  description: "PDF, JPEG или PNG до 20 МиБ"
                document_type:
                  type: "string"
                  enum:
                    - "BANK_STATEMENT"
                    - "FINANCIAL_REPORT"
                    - "COLLATERAL_OWNERSHIP"
                    - "COLLATERAL_VALUATION"
                version:
                  type: "string"
                  pattern: "^[1-9][0-9]{0,8}$"
                  description: "Текущая ревизия заявки"
  /api/v1/applications/{application_id}/documents/{document_id}/download:
    get:
      tags:
        - "Документы"
      summary: "Скачивание файла"
      operationId: "download_document_api_v1_applications__application_id__documents__document_id__download_get"
      parameters:
        -
          name: "application_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Application Id"
        -
          name: "document_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Document Id"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/pdf:
              schema:
                type: "string"
                format: "binary"
            image/jpeg:
              schema:
                type: "string"
                format: "binary"
            image/png:
              schema:
                type: "string"
                format: "binary"
        "422":
          description: "Ошибка проверки данных"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "Владелец заявки или кредитный специалист. `Content-Disposition: attachment`, `Cache-Control: private, no-store`, `Content-Security-Policy: default-src 'none'; sandbox`. 404 `DOCUMENT_NOT_FOUND`."
  /api/v1/applications/{application_id}/documents/{document_id}:
    delete:
      tags:
        - "Документы"
      summary: "Удаление файла"
      operationId: "delete_document_api_v1_applications__application_id__documents__document_id__delete"
      parameters:
        -
          $ref: "#/components/parameters/Origin"
        -
          name: "application_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Application Id"
        -
          name: "document_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Document Id"
        -
          name: "Idempotency-Key"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
            title: "Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionInput"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        "422":
          description: "Ошибка проверки данных"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "Тело `{version}`. Текущий непринятый файл в PREAPPROVED или DOCS_REWORK. 409 `DOCUMENT_ACCEPTED`, 409 `DOCUMENT_NOT_CURRENT`."
  /api/v1/applications/{application_id}/documents/complete:
    post:
      tags:
        - "Документы"
      summary: "Отправка комплекта документов"
      operationId: "complete_documents_api_v1_applications__application_id__documents_complete_post"
      parameters:
        -
          $ref: "#/components/parameters/Origin"
        -
          name: "application_id"
          in: "path"
          required: true
          schema:
            type: "string"
            title: "Application Id"
        -
          name: "Idempotency-Key"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
            title: "Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionInput"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        "422":
          description: "Ошибка проверки данных"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "PREAPPROVED или DOCS_REWORK → DOCS_UPLOADED, когда загружены все обязательные документы и нет отклонённых. 409 `DOCUMENTS_INCOMPLETE` (`details: {missing, rejected}`)."
  /api/v1/integrations/alfa-business/link:
    post:
      tags:
        - "Интеграции"
      summary: "Ссылка на переход в Альфа-Бизнес"
      operationId: "alfa_business_link_api_v1_integrations_alfa_business_link_post"
      parameters:
        -
          $ref: "#/components/parameters/Origin"
        -
          name: "Idempotency-Key"
          in: "header"
          required: true
          schema:
            type: "string"
            minLength: 1
            maxLength: 128
            title: "Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkInput"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        "422":
          description: "Ошибка проверки данных"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "Владелец заявки в статусе APPROVED: `{url: \"/alfa-business/{id}\", simulated: true}`. Ничего не меняет и никуда не обращается. 409 `INVALID_STATUS` до окончательного одобрения."
  /api/v1/health:
    get:
      summary: "Проверка работоспособности"
      operationId: "health_api_v1_health_get"
      responses:
        "200":
          description: "Успешный ответ"
          content:
            application/json:
              schema: {}
        default:
          description: "Ошибка"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - "Служебные"
      description: "`{status: \"ok\", demo_mode}`; выполняет запрос к базе данных."
      security: []
components:
  schemas:
    AnswersInput:
      properties:
        company_confirmed:
          anyOf:
            -
              type: "boolean"
            -
              type: "null"
          title: "Company Confirmed"
        actual_address:
          anyOf:
            -
              type: "string"
              maxLength: 300
            -
              type: "null"
          title: "Actual Address"
        actual_activity:
          anyOf:
            -
              type: "string"
              maxLength: 300
            -
              type: "null"
          title: "Actual Activity"
        purpose:
          anyOf:
            -
              type: "string"
              enum:
                - "working_capital"
                - "business_development"
                - "investment"
                - "refinancing"
            -
              type: "null"
          title: "Purpose"
        requested_amount_rub:
          anyOf:
            -
              type: "integer"
              exclusiveMinimum: 0.0
            -
              type: "null"
          title: "Requested Amount Rub"
        term_months:
          anyOf:
            -
              type: "integer"
              maximum: 120.0
              minimum: 1.0
            -
              type: "null"
          title: "Term Months"
        collateral:
          anyOf:
            -
              $ref: "#/components/schemas/CollateralAnswer"
            -
              type: "null"
        monthly_revenue_rub:
          anyOf:
            -
              type: "integer"
              maximum: 9000000000000000.0
              minimum: 0.0
            -
              type: "null"
          title: "Monthly Revenue Rub"
        previous_monthly_revenue_rub:
          anyOf:
            -
              type: "integer"
              maximum: 9000000000000000.0
              minimum: 0.0
            -
              type: "null"
          title: "Previous Monthly Revenue Rub"
        financial_period_end:
          anyOf:
            -
              type: "string"
              format: "date"
            -
              type: "null"
          title: "Financial Period End"
        tax_regime:
          anyOf:
            -
              type: "string"
              enum:
                - "OSN"
                - "USN"
                - "PSN"
                - "OTHER"
            -
              type: "null"
          title: "Tax Regime"
        employees:
          anyOf:
            -
              type: "integer"
              maximum: 1000000.0
              minimum: 0.0
            -
              type: "null"
          title: "Employees"
        seasonal:
          anyOf:
            -
              type: "boolean"
            -
              type: "null"
          title: "Seasonal"
        monthly_debt_payment_rub:
          anyOf:
            -
              type: "integer"
              maximum: 9000000000000000.0
              minimum: 0.0
            -
              type: "null"
          title: "Monthly Debt Payment Rub"
        tax_debt_rub:
          anyOf:
            -
              type: "integer"
              maximum: 9000000000000000.0
              minimum: 0.0
            -
              type: "null"
          title: "Tax Debt Rub"
        legal_proceedings:
          anyOf:
            -
              type: "boolean"
            -
              type: "null"
          title: "Legal Proceedings"
        obligations_note:
          anyOf:
            -
              type: "string"
              maxLength: 1000
            -
              type: "null"
          title: "Obligations Note"
        representative_name:
          anyOf:
            -
              type: "string"
              maxLength: 100
            -
              type: "null"
          title: "Representative Name"
        representative_authority_confirmed:
          anyOf:
            -
              type: "boolean"
            -
              type: "null"
          title: "Representative Authority Confirmed"
        beneficial_owners_confirmed:
          anyOf:
            -
              type: "boolean"
            -
              type: "null"
          title: "Beneficial Owners Confirmed"
        accuracy_confirmed:
          anyOf:
            -
              type: "boolean"
            -
              type: "null"
          title: "Accuracy Confirmed"
      additionalProperties: false
      type: "object"
      title: "AnswersInput"
      description: |-
        The questionnaire whitelist (the six stages of stages.py); credit history and overdue days are BKI-owned.
        The source-owned answers (tax regime, employees, the representative's name and authority) stay typed here so that a
        client write of one is refused as SOURCE_OWNED_FIELDS by the commands rather than as an unknown key.
    AnswersPatch:
      properties:
        version:
          type: "integer"
          minimum: 1.0
          title: "Version"
        current_stage:
          type: "integer"
          maximum: 6.0
          minimum: 1.0
          title: "Current Stage"
        answers:
          $ref: "#/components/schemas/AnswersInput"
      additionalProperties: false
      type: "object"
      required:
        - "version"
        - "current_stage"
      title: "AnswersPatch"
    ApproveInput:
      properties:
        version:
          type: "integer"
          minimum: 1.0
          title: "Version"
        reason:
          type: "string"
          title: "Reason"
        amount_rub:
          type: "integer"
          maximum: 9000000000000000.0
          exclusiveMinimum: 0.0
          title: "Amount Rub"
      additionalProperties: false
      type: "object"
      required:
        - "version"
        - "reason"
        - "amount_rub"
      title: "ApproveInput"
      description: "The final amount; its bounds are checked against the persisted, accepted document evidence."
    AuthorityCheckInput:
      properties:
        inn:
          type: "string"
          title: "Inn"
      additionalProperties: false
      type: "object"
      required:
        - "inn"
      title: "AuthorityCheckInput"
      description: "The mock Госуслуги check: the ИНН only; the person, role and user come from the fixture and the session."
    CancelInput:
      properties:
        version:
          type: "integer"
          minimum: 1.0
          title: "Version"
        reason:
          type: "string"
          title: "Reason"
      additionalProperties: false
      type: "object"
      required:
        - "version"
        - "reason"
      title: "CancelInput"
    CollateralAnswer:
      properties:
        status:
          anyOf:
            -
              type: "string"
              enum:
                - "unknown"
                - "none"
                - "declared"
            -
              type: "null"
          title: "Status"
        type:
          anyOf:
            -
              type: "string"
              enum:
                - "real_estate"
                - "vehicle"
                - "equipment"
                - "inventory"
                - "deposit"
            -
              type: "null"
          title: "Type"
        declared_value_rub:
          anyOf:
            -
              type: "integer"
              maximum: 9000000000000000.0
              exclusiveMinimum: 0.0
            -
              type: "null"
          title: "Declared Value Rub"
        description:
          anyOf:
            -
              type: "string"
              maxLength: 500
            -
              type: "null"
          title: "Description"
        owner_confirmed:
          anyOf:
            -
              type: "boolean"
            -
              type: "null"
          title: "Owner Confirmed"
        encumbered:
          anyOf:
            -
              type: "boolean"
            -
              type: "null"
          title: "Encumbered"
      additionalProperties: false
      type: "object"
      title: "CollateralAnswer"
      description: "A partial pledge declaration; it is merged into the saved one key by key."
    CompanyInput:
      properties:
        inn:
          type: "string"
          title: "Inn"
        consents:
          items:
            $ref: "#/components/schemas/ConsentInput"
          type: "array"
          maxItems: 2
          title: "Consents"
        authority_verification_id:
          anyOf:
            -
              type: "string"
              maxLength: 36
            -
              type: "null"
          title: "Authority Verification Id"
      additionalProperties: false
      type: "object"
      required:
        - "inn"
        - "consents"
      title: "CompanyInput"
    ConsentInput:
      properties:
        code:
          type: "string"
          enum:
            - "ONBOARDING_PROCESSING"
            - "REGISTRY_LOOKUP"
          title: "Code"
        version:
          type: "string"
          const: "consent-v2"
          title: "Version"
        accepted:
          type: "boolean"
          const: true
          title: "Accepted"
      additionalProperties: false
      type: "object"
      required:
        - "code"
        - "version"
        - "accepted"
      title: "ConsentInput"
    CreateInput:
      properties:
        company_id:
          type: "string"
          maxLength: 36
          title: "Company Id"
        product_id:
          type: "string"
          maxLength: 80
          title: "Product Id"
        recommendation_snapshot_id:
          type: "string"
          maxLength: 36
          title: "Recommendation Snapshot Id"
      additionalProperties: false
      type: "object"
      required:
        - "company_id"
        - "product_id"
        - "recommendation_snapshot_id"
      title: "CreateInput"
    LinkInput:
      properties:
        application_id:
          type: "string"
          maxLength: 36
          title: "Application Id"
      additionalProperties: false
      type: "object"
      required:
        - "application_id"
      title: "LinkInput"
    LoginInput:
      properties:
        email:
          type: "string"
          maxLength: 254
          title: "Email"
        password:
          type: "string"
          maxLength: 128
          minLength: 10
          title: "Password"
      additionalProperties: false
      type: "object"
      required:
        - "email"
        - "password"
      title: "LoginInput"
    NeedInput:
      properties:
        requested_amount_rub:
          type: "integer"
          exclusiveMinimum: 0.0
          title: "Requested Amount Rub"
      additionalProperties: false
      type: "object"
      required:
        - "requested_amount_rub"
      title: "NeedInput"
      description: |-
        The need is the amount alone: purpose, term and collateral are chosen in the questionnaire within the chosen
        product's bounds. Any whole amount from 1 RUB up to the slider maximum is compared (a product may not take it).
    PreapproveInput:
      properties:
        version:
          type: "integer"
          minimum: 1.0
          title: "Version"
        reason:
          type: "string"
          title: "Reason"
        amount_rub:
          type: "integer"
          maximum: 9000000000000000.0
          exclusiveMinimum: 0.0
          title: "Amount Rub"
      additionalProperties: false
      type: "object"
      required:
        - "version"
        - "reason"
        - "amount_rub"
      title: "PreapproveInput"
    RegisterInput:
      properties:
        email:
          type: "string"
          maxLength: 254
          title: "Email"
        password:
          type: "string"
          maxLength: 128
          minLength: 10
          title: "Password"
        display_name:
          type: "string"
          maxLength: 100
          minLength: 1
          title: "Display Name"
      additionalProperties: false
      type: "object"
      required:
        - "email"
        - "password"
        - "display_name"
      title: "RegisterInput"
    RejectInput:
      properties:
        version:
          type: "integer"
          minimum: 1.0
          title: "Version"
        reason:
          type: "string"
          title: "Reason"
      additionalProperties: false
      type: "object"
      required:
        - "version"
        - "reason"
      title: "RejectInput"
    RequestInfoInput:
      properties:
        version:
          type: "integer"
          minimum: 1.0
          title: "Version"
        reason:
          type: "string"
          title: "Reason"
        requested_fields:
          items:
            type: "string"
          type: "array"
          maxItems: 27
          minItems: 1
          title: "Requested Fields"
      additionalProperties: false
      type: "object"
      required:
        - "version"
        - "reason"
        - "requested_fields"
      title: "RequestInfoInput"
      description: "The reason is the question shown to the customer; the fields are distinct questionnaire answer paths."
    RespondInput:
      properties:
        version:
          type: "integer"
          minimum: 1.0
          title: "Version"
        response:
          type: "string"
          title: "Response"
        answers:
          $ref: "#/components/schemas/AnswersInput"
      additionalProperties: false
      type: "object"
      required:
        - "version"
        - "response"
      title: "RespondInput"
      description: |-
        The owner's answer to a client_answers request: a response text and the requested answers only (same field
        validators as the questionnaire; credit history and overdue days are never accepted).
    ReviewInput:
      properties:
        version:
          type: "integer"
          minimum: 1.0
          title: "Version"
        reason:
          type: "string"
          title: "Reason"
        decision:
          type: "string"
          enum:
            - "accept"
            - "reject"
          title: "Decision"
        verified_value_rub:
          anyOf:
            -
              type: "integer"
              maximum: 9000000000000000.0
              exclusiveMinimum: 0.0
            -
              type: "null"
          title: "Verified Value Rub"
      additionalProperties: false
      type: "object"
      required:
        - "version"
        - "reason"
        - "decision"
      title: "ReviewInput"
      description: |-
        A document review. `verified_value_rub` belongs only to accepting a COLLATERAL_VALUATION document (checked
        against the persisted document type).
    StrictModel:
      properties: {}
      additionalProperties: false
      type: "object"
      title: "StrictModel"
    SubmissionConsent:
      properties:
        code:
          type: "string"
          maxLength: 40
          title: "Code"
        version:
          type: "string"
          maxLength: 80
          title: "Version"
        accepted:
          type: "boolean"
          title: "Accepted"
      additionalProperties: false
      type: "object"
      required:
        - "code"
        - "version"
        - "accepted"
      title: "SubmissionConsent"
    SubmitInput:
      properties:
        version:
          type: "integer"
          minimum: 1.0
          title: "Version"
        consents:
          items:
            $ref: "#/components/schemas/SubmissionConsent"
          type: "array"
          maxItems: 10
          title: "Consents"
      additionalProperties: false
      type: "object"
      required:
        - "version"
      title: "SubmitInput"
    VersionInput:
      properties:
        version:
          type: "integer"
          minimum: 1.0
          title: "Version"
      additionalProperties: false
      type: "object"
      required:
        - "version"
      title: "VersionInput"
    Error:
      type: "object"
      required:
        - "error"
      additionalProperties: false
      properties:
        error:
          type: "object"
          required:
            - "code"
            - "message"
          properties:
            code:
              type: "string"
              description: "Английский код ошибки"
              examples:
                - "VERSION_CONFLICT"
            message:
              type: "string"
              description: "Сообщение на русском языке"
            fields:
              type: "object"
              additionalProperties:
                type: "string"
              description: "Сообщения по полям запроса"
            details:
              type: "object"
              description: "Дополнительные данные (например, границы суммы)"
  parameters:
    Origin:
      name: "Origin"
      in: "header"
      required: true
      description: "Адрес интерфейса, точно равный `UI_ORIGIN`"
      schema:
        type: "string"
        example: "http://localhost:5173"
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "credit_route_session"
      description: "Сессия, которую ставят `POST /auth/register` и `POST /auth/login`"
servers:
  -
    url: "http://localhost:5173"
    description: "Интерфейс (Vite или nginx) с прокси на API: тот же адрес, что и Origin"
tags:
  -
    name: "Аутентификация"
    description: "Регистрация клиента, вход, выход и текущий пользователь. Сессия — cookie `credit_route_session`."
  -
    name: "Госуслуги"
    description: "Заглушка подтверждения полномочий представителя компании."
  -
    name: "Компании"
    description: "Компании клиента, проверка источников (реестр и обороты), тексты согласий."
  -
    name: "Каталог и подбор"
    description: "Каталог продуктов и неизменяемые снимки подбора на сумму."
  -
    name: "Заявки клиента"
    description: "Черновик, анкета из шести этапов, отправка, повторная проверка, ответ на запрос, отмена, история."
  -
    name: "Документы"
    description: "Перечень документов, загрузка, скачивание, удаление и отправка комплекта."
