server {
  listen 80;
  root /usr/share/nginx/html;
  server_name _;
  # Document uploads: a 20 MiB file plus the multipart envelope; the API enforces the exact limit (413 FILE_TOO_LARGE).
  location /api/ { client_max_body_size 21m; proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { try_files $uri $uri/ /index.html; }
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy same-origin;
}
